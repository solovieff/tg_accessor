[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tg-accessor"
version = "0.1.0"
description = "Telegram group dialogue exporter, cleaner, and analytics toolkit"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "telethon>=1.45.0",
    "python-dotenv>=1.0.0",
    "typesafe-sdk>=0.7.0",
    "tqdm>=4.70.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
group-seeker = "providers.telegram.__main__:main"
smart-segmenter = "smart_segmenter.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]


